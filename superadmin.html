<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Admin — WiFi Troubleshooter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #cc0000; --red-d: #aa0000; --dark: #0d0d0d;
      --dark2: #1a1a1a; --dark3: #222222; --silver: #c0c0c0;
      --white: #ffffff; --gray: #888888; --border: #333333;
      --green: #16a34a; --amber: #d97706; --radius: 12px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #loginScreen { background: var(--dark2); border: 1.5px solid var(--red); border-radius: 18px; padding: 36px 28px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 0 40px rgba(204,0,0,.2); }
    #loginScreen h2 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: var(--white); margin-bottom: 4px; }
    #loginScreen h2 span { color: var(--red); }
    #loginScreen p { font-size: 13px; color: var(--gray); margin-bottom: 24px; }
    #loginScreen input { width: 100%; padding: 12px 14px; font-size: 15px; font-family: 'Inter', sans-serif; border: 1.5px solid var(--border); border-radius: 10px; outline: none; margin-bottom: 12px; color: var(--white); background: var(--dark3); }
    #loginScreen input:focus { border-color: var(--red); }
    #loginBtn { width: 100%; padding: 12px; background: var(--red); color: var(--white); font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; border: none; border-radius: 10px; cursor: pointer; }
    #loginBtn:hover { background: var(--red-d); }
    #loginError { color: #ff6666; font-size: 12px; margin-top: 8px; display: none; }
    #adminPanel { display: none; width: 100%; max-width: 750px; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .admin-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: var(--white); }
    .admin-header h1 span { color: var(--red); }
    #logoutBtn { background: transparent; border: 1.5px solid var(--border); color: var(--silver); padding: 7px 14px; border-radius: 8px; font-size: 12px; font-family: 'Inter', sans-serif; cursor: pointer; }
    #logoutBtn:hover { border-color: var(--red); color: var(--white); }
    .top-bar { height: 3px; background: linear-gradient(90deg, var(--red), #ff4444, var(--red)); border-radius: 3px 3px 0 0; margin-bottom: 0; }
    .stats-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-box { flex: 1; min-width: 80px; background: var(--dark2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-box .num { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--red); }
    .stat-box .lbl { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .card { background: var(--dark2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 600; color: var(--silver); }
    .field input, .field select { padding: 9px 12px; font-size: 13px; font-family: 'Inter', sans-serif; border: 1.5px solid var(--border); border-radius: 8px; outline: none; color: var(--white); background: var(--dark3); }
    .field input:focus, .field select:focus { border-color: var(--red); }
    .field select option { background: var(--dark3); }
    .color-row { display: flex; align-items: center; gap: 8px; }
    .color-row input[type="color"] { width: 36px; height: 32px; padding: 2px; border-radius: 6px; cursor: pointer; flex-shrink: 0; border: 1.5px solid var(--border); background: var(--dark3); }
    .color-row input[type="text"] { flex: 1; }
    .btn { padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; border: none; border-radius: 8px; cursor: pointer; transition: all .2s; }
    .btn-red { background: var(--red); color: var(--white); }
    .btn-red:hover { background: var(--red-d); }
    .btn-green { background: var(--green); color: var(--white); }
    .btn-green:hover { background: #15803d; }
    .btn-amber { background: var(--amber); color: var(--white); }
    .btn-amber:hover { background: #b45309; }
    .btn-dark { background: var(--dark3); color: var(--silver); border: 1px solid var(--border); }
    .btn-dark:hover { border-color: var(--red); color: var(--white); }
    .btn-full { width: 100%; margin-top: 14px; padding: 12px; font-size: 14px; }
    .client-card { background: var(--dark3); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; border-left: 4px solid var(--red); }
    .client-card.inactive { border-left-color: var(--border); opacity: .65; }
    .client-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .client-name { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--white); }
    .client-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .client-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .meta-pill { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--gray); }
    .meta-pill.plan { background: rgba(204,0,0,.15); color: #ff8080; border-color: rgba(204,0,0,.3); font-weight: 600; }
    .meta-pill.billing-ok { background: rgba(22,163,74,.15); color: #4ade80; border-color: rgba(22,163,74,.3); }
    .meta-pill.billing-soon { background: rgba(217,119,6,.15); color: #fbbf24; border-color: rgba(217,119,6,.3); font-weight: 600; }
    .meta-pill.billing-due { background: rgba(204,0,0,.2); color: #ff4444; border-color: rgba(204,0,0,.4); font-weight: 700; animation: pulseWarn 1.5s infinite; }
    @keyframes pulseWarn { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
    .client-link { font-size: 11px; color: var(--red); margin-top: 6px; word-break: break-all; text-decoration: none; display: block; }
    .client-link:hover { color: #ff4444; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; margin-left: 8px; }
    .badge-active { background: rgba(22,163,74,.2); color: #4ade80; }
    .badge-inactive { background: rgba(204,0,0,.2); color: #ff8080; }
    .no-clients { text-align: center; padding: 30px; color: var(--gray); font-size: 14px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark2); color: var(--white); padding: 11px 22px; border-radius: 30px; font-size: 13px; font-weight: 500; transition: transform .3s; z-index: 999; border: 1px solid var(--border); }
    #toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: 1; }
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <div style="font-size:36px;margin-bottom:12px;">📶</div>
  <h2>Site<span>Link</span> Solutions</h2>
  <p>WiFi Troubleshooter — Super Admin</p>
  <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') login()">
  <button id="loginBtn" onclick="login()">Sign In</button>
  <p id="loginError">Incorrect password. Try again.</p>
</div>

<div id="adminPanel">
  <div class="top-bar"></div>
  <br>
  <div class="admin-header">
    <h1>Site<span>Link</span> — WiFi Admin</h1>
    <button id="logoutBtn" onclick="logout()">Sign Out</button>
  </div>

  <div class="stats-bar">
    <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat-box"><div class="num" id="statActive">0</div><div class="lbl">Active</div></div>
    <div class="stat-box"><div class="num" id="statInactive">0</div><div class="lbl">Inactive</div></div>
    <div class="stat-box"><div class="num" id="statMonthly">0</div><div class="lbl">Monthly</div></div>
    <div class="stat-box"><div class="num" id="stat6Month">0</div><div class="lbl">6 Month</div></div>
    <div class="stat-box"><div class="num" id="stat1Year">0</div><div class="lbl">1 Year</div></div>
  </div>

  <div class="card">
    <div class="card-title">➕ Add New Client</div>
    <div class="form-grid">
      <div class="field">
        <label>Company Name *</label>
        <input type="text" id="f_name" placeholder="e.g. SpeedNet Internet">
      </div>
      <div class="field">
        <label>Client ID (URL key) *</label>
        <input type="text" id="f_id" placeholder="e.g. speednet" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')">
      </div>
      <div class="field">
        <label>Contact Person</label>
        <input type="text" id="f_contact" placeholder="e.g. John Smith">
      </div>
      <div class="field">
        <label>Support Phone Number</label>
        <input type="text" id="f_phone" placeholder="e.g. +27821234567">
      </div>
      <div class="field">
        <label>Plan Type</label>
        <select id="f_plan">
          <option value="Monthly">Monthly — R800/month</option>
          <option value="6 Month">6 Month — R700/month</option>
          <option value="1 Year">1 Year — R600/month</option>
        </select>
      </div>
      <div class="field">
        <label>Billing Date</label>
        <select id="f_billingType" onchange="toggleBillingDay()">
          <option value="eom">End of Month (auto-adjusts each month)</option>
          <option value="day">Specific Day of Month</option>
        </select>
      </div>
      <div class="field" id="billingDayField" style="display:none;">
        <label>Day of Month (1-31)</label>
        <input type="number" id="f_billingDay" min="1" max="31" placeholder="e.g. 7 or 15">
      </div>
      <div class="field">
        <label>Primary Color</label>
        <div class="color-row">
          <input type="color" id="f_primaryPicker" value="#1a56db" oninput="document.getElementById('f_primary').value=this.value">
          <input type="text" id="f_primary" value="#1a56db" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)) document.getElementById('f_primaryPicker').value=this.value">
        </div>
      </div>
      <div class="field">
        <label>Header Color</label>
        <div class="color-row">
          <input type="color" id="f_headerPicker" value="#0a1628" oninput="document.getElementById('f_header').value=this.value">
          <input type="text" id="f_header" value="#0a1628" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)) document.getElementById('f_headerPicker').value=this.value">
        </div>
      </div>
      <div class="field">
        <label>Accent Color</label>
        <div class="color-row">
          <input type="color" id="f_accentPicker" value="#38bdf8" oninput="document.getElementById('f_accent').value=this.value">
          <input type="text" id="f_accent" value="#38bdf8" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)) document.getElementById('f_accentPicker').value=this.value">
        </div>
      </div>
      <div class="field">
        <label>Footer Text</label>
        <input type="text" id="f_footer" placeholder="e.g. © 2026 SpeedNet. All Rights Reserved.">
      </div>
    </div>
    <button class="btn btn-green btn-full" onclick="addClient()">✅ Add Client</button>
  </div>

  <div class="card">
    <div class="card-title">👥 All Clients</div>
    <div id="clientList"><div class="no-clients">No clients yet.</div></div>
  </div>

  <div class="card">
    <div class="card-title">🔑 Change Admin Password</div>
    <div class="form-grid">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="Enter new password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Repeat new password">
      </div>
    </div>
    <button class="btn btn-red btn-full" onclick="changePassword()">🔒 Update Password</button>
  </div>
</div>

<div id="paidModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--dark2);border:1.5px solid var(--red);border-radius:14px;padding:24px;width:100%;max-width:360px;">
    <h3 style="font-family:'Space Grotesk',sans-serif;color:var(--white);font-size:16px;margin-bottom:6px;">💰 Mark as Paid</h3>
    <p id="paidClientName" style="font-size:12px;color:var(--gray);margin-bottom:16px;"></p>
    <label style="font-size:12px;font-weight:600;color:var(--silver);display:block;margin-bottom:5px;">Months Paid Ahead</label>
    <select id="monthsAhead" style="width:100%;padding:10px;font-size:14px;border:1.5px solid var(--border);border-radius:8px;background:var(--dark3);color:var(--white);margin-bottom:16px;">
      <option value="1">1 Month</option>
<option value="2">2 Months</option>
<option value="3">3 Months</option>
<option value="4">4 Months</option>
<option value="5">5 Months</option>
<option value="6">6 Months</option>
<option value="7">7 Months</option>
<option value="8">8 Months</option>
<option value="9">9 Months</option>
<option value="10">10 Months</option>
<option value="11">11 Months</option>
<option value="12">12 Months</option>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-dark" style="flex:1;" onclick="closePaidModal()">Cancel</button>
      <button class="btn btn-green" style="flex:1;" onclick="confirmMarkPaid()">✅ Confirm Payment</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getDatabase(app);
  window._db = db; window._ref = ref; window._get = get;
  window._set = set; window._remove = remove; window._update = update;
  window._firebaseReady = true;
</script>

<script>
  const DEFAULT_PASSWORD = "superadmin1234";

  async function login() {
    const input = document.getElementById('passwordInput').value;
    let stored = DEFAULT_PASSWORD;
    try {
      if (window._db && window._ref && window._get) {
        const snap = await window._get(window._ref(window._db, "superadmin/password"));
        if (snap.exists()) stored = snap.val();
      }
    } catch(e) { console.warn('Firebase check failed, using default password.', e); }
    if (input === stored) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadClients();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
  }

  async function addClient() {
    const id      = document.getElementById('f_id').value.trim();
    const name    = document.getElementById('f_name').value.trim();
    const contact = document.getElementById('f_contact').value.trim();
    const phone   = document.getElementById('f_phone').value.trim();
    const plan    = document.getElementById('f_plan').value;
    const billingType = document.getElementById('f_billingType').value;
    const billingDay  = document.getElementById('f_billingDay').value;
    const billing = billingType === 'eom' ? 'End of Month' : `Day ${billingDay} of each month`;
    const primary = document.getElementById('f_primary').value.trim();
    const header  = document.getElementById('f_header').value.trim();
    const accent  = document.getElementById('f_accent').value.trim();
    const footer  = document.getElementById('f_footer').value.trim();
    if (!id || !name) { showToast('❌ Company name and Client ID are required.'); return; }
    try {
      const existing = await window._get(window._ref(window._db, 'clients/' + id));
      if (existing.exists()) { showToast('❌ Client ID already exists.'); return; }
      await window._set(window._ref(window._db, 'clients/' + id), {
        id, name, contact, phone, plan, billing,
        primaryColor: primary, headerColor: header, accentColor: accent,
        footerText: footer || '© 2026 ' + name + '. All Rights Reserved.',
        active: true, createdAt: new Date().toISOString(),
        nextDue: new Date().toISOString()
      });
      showToast('✅ Client added!');
      clearForm();
      loadClients();
    } catch(e) { showToast('❌ Error adding client.'); }
  }

  async function loadClients() {
    const list = document.getElementById('clientList');
    list.innerHTML = '<div class="no-clients">Loading...</div>';
    try {
      const snap = await window._get(window._ref(window._db, 'clients'));
      if (!snap.exists()) { list.innerHTML = '<div class="no-clients">No clients yet.</div>'; updateStats({}); return; }
      const clients = snap.val();
      updateStats(clients);
      list.innerHTML = '';
      Object.entries(clients).sort((a,b) => a[1].name.localeCompare(b[1].name)).forEach(([id, c]) => {
        const link = `wifi-troubleshooter.netlify.app?client=${id}`;
        const billingInfo = getBillingStatus(c.nextDue);
        list.innerHTML += `
          <div class="client-card ${c.active ? '' : 'inactive'}">
            <div class="client-top">
              <div>
                <span class="client-name">${c.name}</span>
                <span class="badge ${c.active ? 'badge-active' : 'badge-inactive'}">${c.active ? 'Active' : 'Inactive'}</span>
              </div>
              <div class="client-actions">
                <button class="btn btn-green" onclick="openPaidModal('${id}', '${c.name}')">💰 Mark Paid</button>
                <button class="btn btn-${c.active ? 'amber' : 'green'}" onclick="${c.active ? 'deactivate' : 'activate'}Client('${id}')">${c.active ? '⏸ Deactivate' : '▶ Activate'}</button>
                <button class="btn btn-dark" onclick="editClient('${id}')">✏️ Edit</button>
                <button class="btn btn-red" onclick="deleteClient('${id}', '${c.name}')">🗑</button>
              </div>
            </div>
            <div class="client-meta">
              ${c.contact ? `<span class="meta-pill">👤 ${c.contact}</span>` : ''}
              ${c.phone ? `<span class="meta-pill">📞 ${c.phone}</span>` : ''}
              ${c.plan ? `<span class="meta-pill plan">📋 ${c.plan}</span>` : ''}
              ${c.billing ? `<span class="meta-pill">📅 ${c.billing}</span>` : ''}
              ${c.nextDue ? `<span class="meta-pill ${billingInfo.cls}">${billingInfo.icon} ${billingInfo.text}</span>` : ''}
            </div>
            <a class="client-link" href="https://${link}" target="_blank">🔗 ${link}</a>
          </div>`;
      });
    } catch(e) { list.innerHTML = '<div class="no-clients">Error loading clients.</div>'; }
  }

  function updateStats(clients) {
    const all = Object.values(clients);
    document.getElementById('statTotal').textContent    = all.length;
    document.getElementById('statActive').textContent   = all.filter(c => c.active).length;
    document.getElementById('statInactive').textContent = all.filter(c => !c.active).length;
    document.getElementById('statMonthly').textContent  = all.filter(c => c.plan === 'Monthly').length;
    document.getElementById('stat6Month').textContent   = all.filter(c => c.plan === '6 Month').length;
    document.getElementById('stat1Year').textContent    = all.filter(c => c.plan === '1 Year').length;
  }

  function toggleBillingDay() {
    const type = document.getElementById('f_billingType').value;
    document.getElementById('billingDayField').style.display = type === 'day' ? 'flex' : 'none';
  }

  function getBillingStatus(nextDueISO) {
    if (!nextDueISO) return { cls: '', icon: '📅', text: 'No due date set' };
    const now = new Date();
    const due = new Date(nextDueISO);
    const diffDays = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) {
      return { cls: 'billing-due', icon: '🔴', text: `${Math.abs(diffDays)} day${Math.abs(diffDays)===1?'':'s'} OVERDUE` };
    } else if (diffDays === 0) {
      return { cls: 'billing-due', icon: '🔴', text: 'Due TODAY' };
    } else if (diffDays <= 5) {
      return { cls: 'billing-soon', icon: '🟡', text: `Due in ${diffDays} day${diffDays===1?'':'s'}` };
    } else {
      return { cls: 'billing-ok', icon: '🟢', text: `Due in ${diffDays} days` };
    }
  }

  let currentPaidClientId = null;

  function openPaidModal(id, name) {
    currentPaidClientId = id;
    document.getElementById('paidClientName').textContent = name;
    document.getElementById('monthsAhead').value = '1';
    document.getElementById('paidModal').style.display = 'flex';
  }

  function closePaidModal() {
    document.getElementById('paidModal').style.display = 'none';
    currentPaidClientId = null;
  }

  async function confirmMarkPaid() {
    if (!currentPaidClientId) return;
    const months = parseInt(document.getElementById('monthsAhead').value);
    try {
      const snap = await window._get(window._ref(window._db, 'clients/' + currentPaidClientId));
      const c = snap.val();
      const base = c.nextDue && new Date(c.nextDue) > new Date() ? new Date(c.nextDue) : new Date();
      base.setMonth(base.getMonth() + months);
      await window._update(window._ref(window._db, 'clients/' + currentPaidClientId), {
        nextDue: base.toISOString(),
        lastPaidAt: new Date().toISOString(),
        lastPaidMonths: months
      });
      showToast(`✅ Marked as paid for ${months} month${months===1?'':'s'}!`);
      closePaidModal();
      loadClients();
    } catch(e) { showToast('❌ Could not update payment.'); }
  }

  async function activateClient(id) {
    await window._update(window._ref(window._db, 'clients/' + id), { active: true });
    showToast('✅ Client activated.');
    loadClients();
  }

  async function deactivateClient(id) {
    await window._update(window._ref(window._db, 'clients/' + id), { active: false });
    showToast('⏸ Client deactivated.');
    loadClients();
  }

  async function deleteClient(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    await window._remove(window._ref(window._db, 'clients/' + id));
    showToast('🗑 Client deleted.');
    loadClients();
  }
  async function editClient(id) {
    try {
      const snap = await window._get(window._ref(window._db, 'clients/' + id));
      if (!snap.exists()) return;
      const c = snap.val();
      document.getElementById('f_name').value    = c.name || '';
      document.getElementById('f_id').value      = c.id || id;
      document.getElementById('f_contact').value = c.contact || '';
      document.getElementById('f_phone').value   = c.phone || '';
      document.getElementById('f_plan').value    = c.plan || 'Monthly';
      if (c.billing && c.billing.startsWith('Day ')) {
        document.getElementById('f_billingType').value = 'day';
        document.getElementById('f_billingDay').value = c.billing.match(/\d+/)[0];
        toggleBillingDay();
      } else {
        document.getElementById('f_billingType').value = 'eom';
        document.getElementById('f_billingDay').value = '';
        toggleBillingDay();
      }
      document.getElementById('f_primary').value = c.primaryColor || '#1a56db';
      document.getElementById('f_primaryPicker').value = c.primaryColor || '#1a56db';
      document.getElementById('f_header').value  = c.headerColor || '#0a1628';
      document.getElementById('f_headerPicker').value  = c.headerColor || '#0a1628';
      document.getElementById('f_accent').value  = c.accentColor || '#38bdf8';
      document.getElementById('f_accentPicker').value  = c.accentColor || '#38bdf8';
      document.getElementById('f_footer').value  = c.footerText || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('✏️ Client loaded into form. Edit and click Add to save changes.');
    } catch(e) { showToast('❌ Could not load client.'); }
  }

  async function changePassword() {
    const np = document.getElementById('newPass').value;
    const cp = document.getElementById('confirmPass').value;
    if (!np) { showToast('❌ Enter a new password.'); return; }
    if (np !== cp) { showToast('❌ Passwords do not match.'); return; }
    try {
      await window._set(window._ref(window._db, 'superadmin/password'), np);
      showToast('✅ Password updated successfully!');
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
    } catch(e) { showToast('❌ Could not update password.'); }
  }

  function clearForm() {
    ['f_name','f_id','f_contact','f_phone','f_footer','f_billingDay'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_plan').value = 'Monthly';
    document.getElementById('f_billingType').value = 'eom';
    toggleBillingDay();
    document.getElementById('f_primary').value = '#1a56db';
    document.getElementById('f_primaryPicker').value = '#1a56db';
    document.getElementById('f_header').value = '#0a1628';
    document.getElementById('f_headerPicker').value = '#0a1628';
    document.getElementById('f_accent').value = '#38bdf8';
    document.getElementById('f_accentPicker').value = '#38bdf8';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  window.login = login; window.logout = logout;
  window.addClient = addClient; window.loadClients = loadClients;
  window.activateClient = activateClient; window.deactivateClient = deactivateClient;
  window.deleteClient = deleteClient; window.editClient = editClient;
  window.changePassword = changePassword; window.toggleBillingDay = toggleBillingDay;
  window.openPaidModal = openPaidModal; window.closePaidModal = closePaidModal;
  window.confirmMarkPaid = confirmMarkPaid;
</script>

</body>
</html>
